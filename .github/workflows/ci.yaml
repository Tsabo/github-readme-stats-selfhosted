---
name: CI
on:
  push:
    branches:
      - main
      - "feat/*"
  pull_request:
    branches:
      - main
      - "feat/*"
    paths:
      - "Dockerfile"
      - "nginx.conf.template"
      - "patches/**"
      - ".github/workflows/**"
jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          load: true
          tags: local/github-readme-stats:test

      - name: Build web image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: false
          load: true
          tags: local/github-readme-stats-web:test

      - name: Smoke test containers
        run: |
          docker network create grs
          docker run -d --rm --name github-readme-stats --network grs -p 9000:9000 \
            -e PAT_1=$GH_README_STATS_PAT \
            local/github-readme-stats:test
          docker run -d --rm --name grs-web --network grs -p 8080:8080 \
            local/github-readme-stats-web:test
          sleep 5
          curl -f "http://localhost:9000/api?username=octocat" -o /tmp/card.svg
          file /tmp/card.svg
          grep -q "<svg" /tmp/card.svg
          # Trailing slash must resolve like on Vercel (regression guard).
          curl -f "http://localhost:9000/api/pin/?username=octocat&repo=Hello-World" -o /tmp/pin.svg
          grep -q "<svg" /tmp/pin.svg
          # Web image: static site plus /api pass-through.
          curl -f "http://localhost:8080/frontend/" -o /dev/null
          curl -f "http://localhost:8080/frontend/docs/" -o /dev/null
          curl -f "http://localhost:8080/api/pin/?username=octocat&repo=Hello-World" -o /tmp/pin-web.svg
          grep -q "<svg" /tmp/pin-web.svg
          docker logs github-readme-stats
          docker logs grs-web
          docker stop grs-web github-readme-stats
        env:
          GH_README_STATS_PAT: ${{ secrets.GH_README_STATS_PAT }}
